# Release on a v* tag: tests, Docker image to GHCR (amd64 + arm64), npm packages.
# npm uses trusted publishing (OIDC, no token): each package must list this repository
# and release.yml as its trusted publisher on npmjs.com. Versions already on npm are skipped.
# Every publishing job runs in the `release` environment: it waits for the owner's approval in Actions,
# so a stolen push access alone cannot publish. Actions are pinned to commit SHAs (Dependabot updates them).
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    container: alpine:3.23
    steps:
      - run: apk add --no-cache nodejs npm hunspell git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test

  image:
    environment: release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  npm:
    environment: release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      # Order matters: the widget and the server depend on the core.
      - run: |
          for dir in core widget server; do
            name=$(node -p "require('./packages/$dir/package.json').name")
            version=$(node -p "require('./packages/$dir/package.json').version")
            # Empty answer = this version is not on npm yet (also when the package is new).
            if [ "$(npm view "$name@$version" version 2>/dev/null)" = "$version" ]; then
              echo "$name@$version is already on npm, skipping"
            else
              npm publish -w "packages/$dir" --access public
            fi
          done

  # WordPress plugin: a zip in the GitHub release of this tag. The committed build must be fresh.
  wordpress:
    environment: release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: |
          version=$(node -p "require('./packages/wordpress/package.json').version")
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "plugin $version does not match the tag $GITHUB_REF_NAME"; exit 1; }
          npm run build -w reedach-wordpress
          git diff --exit-code -- packages/wordpress/reedach
          cd packages/wordpress && zip -qr "../../reedach-wordpress-$version.zip" reedach
      - env:
          GH_TOKEN: ${{ github.token }}
        # Release notes: this version's section of CHANGELOG.md plus where to get the packages.
        run: |
          awk -v v="## ${GITHUB_REF_NAME#v} " 'index($0, v) == 1 {f = 1; next} /^## / {f = 0} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "CHANGELOG.md has no section for ${GITHUB_REF_NAME#v}"; exit 1; }
          printf '\nnpm: reedach, reedach-widget, reedach-server. Docker: ghcr.io/%s. WordPress: the zip below, Plugins → Add New → Upload.\n' "${{ github.repository }}" >> notes.md
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "Reedach $GITHUB_REF_NAME" --notes-file notes.md
          gh release upload "$GITHUB_REF_NAME" reedach-wordpress-*.zip --clobber
