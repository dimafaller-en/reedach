# Release on a v* tag: tests, Docker image to GHCR (amd64 + arm64), npm packages.
# npm uses trusted publishing (OIDC, no token): each package must list this repository
# and release.yml as its trusted publisher on npmjs.com. Versions already on npm are skipped.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    container: alpine:3.23
    steps:
      - run: apk add --no-cache nodejs npm hunspell git
      - uses: actions/checkout@v7
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  npm:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      # Order matters: the widget and the server depend on the core.
      - run: |
          for dir in core widget server; do
            name=$(node -p "require('./packages/$dir/package.json').name")
            version=$(node -p "require('./packages/$dir/package.json').version")
            # Empty answer = this version is not on npm yet (also when the package is new).
            if [ "$(npm view "$name@$version" version 2>/dev/null)" = "$version" ]; then
              echo "$name@$version is already on npm, skipping"
            else
              npm publish -w "packages/$dir" --access public
            fi
          done

  # WordPress plugin: a zip in the GitHub release of this tag. The committed build must be fresh.
  wordpress:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: |
          version=$(node -p "require('./packages/wordpress/package.json').version")
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "plugin $version does not match the tag $GITHUB_REF_NAME"; exit 1; }
          npm run build -w reedach-wordpress
          git diff --exit-code -- packages/wordpress/reedach
          cd packages/wordpress && zip -qr "../../reedach-wordpress-$version.zip" reedach
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "Reedach $GITHUB_REF_NAME" \
            --notes "npm: reedach, reedach-widget, reedach-server. Docker: ghcr.io/${{ github.repository }}. WordPress plugin: reedach-wordpress zip below (Plugins → Add New → Upload)."
          gh release upload "$GITHUB_REF_NAME" reedach-wordpress-*.zip --clobber
