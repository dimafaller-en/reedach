name: test
on:
  push:
    branches: ["**"]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    container: alpine:3.23
    steps:
      - run: apk add --no-cache nodejs npm hunspell git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
